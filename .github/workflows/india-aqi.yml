name: Delhi AQI MLOps
on:
  push:
    paths: ['mlops/india_aqi/**', '.github/workflows/india-aqi.yml']
  pull_request:
    paths: ['mlops/india_aqi/**', '.github/workflows/india-aqi.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy passing candidate to configured GCP project'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: india-aqi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops/india_aqi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.2
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python scripts/download_data.py --verify
      - run: uv run python pipeline.py train
      - run: uv run python monitor.py --inject-drift
      - name: Build and smoke-test actual container
        run: |
          set -euo pipefail
          RUN_ID=$(python -c 'import json; print(json.load(open("artifacts/latest.json"))["run_id"])')
          docker build --build-arg "MODEL_RUN=$RUN_ID" -t delhi-aqi:ci .
          docker run -d --name aqi-ci -p 8080:8080 delhi-aqi:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs aqi-ci; exit 1; fi
            sleep 2
          done
          uv run python scripts/smoke.py http://localhost:8080
      - name: Save candidate run
        uses: actions/upload-artifact@v4
        with:
          name: aqi-candidate
          path: mlops/india_aqi/artifacts/
          retention-days: 14
      - name: Container logs and cleanup
        if: always()
        run: |
          set -euo pipefail
          if docker container inspect aqi-ci >/dev/null 2>&1; then
            docker logs aqi-ci
            docker rm -f aqi-ci
          fi
  deploy:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: aqi-demo
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
      GCP_BUCKET: ${{ vars.GCP_BUCKET }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      GCP_SERVICE: delhi-aqi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aqi-candidate
          path: mlops/india_aqi/artifacts
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Approved candidate rollout
        working-directory: mlops/india_aqi
        run: bash scripts/deploy.sh
